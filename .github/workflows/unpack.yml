name: Descompactar projeto
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [ -f itac-love-src.zip ]; then
            unzip -o itac-love-src.zip
            rm -f itac-love-src.zip android-overrides/.gitkeep
            git config user.name github-actions
            git config user.email github-actions@users.noreply.github.com
            git add -A
            git commit -m "Adiciona projeto ITAC LOVE"
            git push
          fi
